<svg width="420" height="100" viewBox="0 0 420 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="neonGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#FF2BD6"/>
    </linearGradient>
  </defs>
  <rect width="420" height="100" fill="transparent"/>
  <text x="20" y="52"
        font-family="Orbitron, Arial, sans-serif"
        font-size="34"
        font-weight="700"
        letter-spacing="2"
        fill="url(#neonGradient)"
        filter="url(#cyanGlow)">
    &lt;ZAMARRON/&gt;
  </text>
  <text x="86" y="76"
        font-family="Rajdhani, Arial, sans-serif"
        font-size="12"
        font-weight="500"
        letter-spacing="6"
        fill="#FF2BD6">
    SOFTWARE DEVELOPER
  </text>
</svg>