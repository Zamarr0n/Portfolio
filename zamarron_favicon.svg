<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#050713"/>
  <rect x="5" y="5" width="54" height="54" rx="12" fill="none" stroke="#00F5FF" stroke-width="1.5"/>
  <text x="50%" y="54%"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="Orbitron, Arial, sans-serif"
        font-size="20"
        font-weight="700"
        fill="#00F5FF"
        filter="url(#glow)">
    &lt;Z/&gt;
  </text>
</svg>